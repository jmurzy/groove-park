name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/api-deploy.yml"
      - "workers/api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.3
          # Resolve Node.js from this worker's .nvmrc when mise installs tools.
          working_directory: workers/api

      - name: Install dependencies
        run: just install

      - name: Check Worker
        env:
          # The Worker requires a Liftie identifier, but tests do not call the Liftie service.
          LIFTIE_USER_AGENT: "Example/1.0 (+https://example.com; contact: ops@example.com)"
        run: just check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/api
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.3
          # Resolve Node.js from this worker's .nvmrc when mise installs tools.
          working_directory: workers/api

      - name: Install dependencies
        run: just install

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFTIE_USER_AGENT: ${{ secrets.LIFTIE_USER_AGENT }}
        run: just deploy --yes
