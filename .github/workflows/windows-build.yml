name: Windows build

on:
  workflow_run:
    workflows:
      - Checks
    types:
      - completed

jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Builds the exact commit that completed the successful Checks workflow.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just@1.58.0
          fallback: none

      # Supplies bsdtar, which the packaging recipe uses for reproducible archives.
      - name: Install bsdtar
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools

      # Sets up the verified editor and templates required for Windows exports.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        env:
          GODOT_RELEASE: 4.6.3-stable
          GODOT_TEMPLATE_VERSION: 4.6.3.stable
        with:
          release: ${{ env.GODOT_RELEASE }}
          install-export-templates: "true"
          template-version: ${{ env.GODOT_TEMPLATE_VERSION }}

      - name: Import, export, and package Windows release
        env:
          GODOT_BIN: godot
        run: just package-ags

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HEAVENLY-windows-x86_64
          path: |
            HEAVENLY-windows-x86_64.zip
            HEAVENLY-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: >-
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: HEAVENLY-windows-x86_64

      # Publishes the tagged build and replaces assets when the release already exists.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" \
            HEAVENLY-windows-x86_64.zip \
            HEAVENLY-windows-x86_64.zip.sha256 \
            --clobber
