name: Web Build

on:
  workflow_run:
    workflows:
      - Checks
    types:
      - completed

concurrency:
  # Serialize current.json updates so an older build cannot promote after a newer one.
  group: web-build-grp
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    env:
      # workflow_run's GITHUB_SHA can differ from the commit that completed Checks.
      RELEASE: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      # Builds the exact commit that completed the successful Checks workflow.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just@1.58.0
          fallback: none

      # Sets up the verified editor and templates required for web exports.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot
        env:
          GODOT_RELEASE: 4.6.3-stable
          GODOT_TEMPLATE_VERSION: 4.6.3.stable
        with:
          release: ${{ env.GODOT_RELEASE }}
          install-export-templates: "true"
          template-version: ${{ env.GODOT_TEMPLATE_VERSION }}

      - name: Export Web game
        env:
          GODOT_BIN: godot
        run: just export-web

      - name: Upload Web release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HEAVENLY-web
          path: build/web
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    runs-on: ubuntu-24.04
    env:
      RELEASE: ${{ github.event.workflow_run.head_sha }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Download Web release
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: HEAVENLY-web
          path: build/web

      # Provides the Node.js runtime needed to install the R2 upload CLI.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      # Install the exact CLI version used to publish game assets to R2.
      - name: Install Wrangler
        run: npm install --global wrangler@4.145.0

      # Uploads the release configuration without caching so clients resolve the current release.
      - name: Upload release configuration
        env:
          R2_BUCKET: game-releases
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          wrangler r2 object put "$R2_BUCKET/releases/$RELEASE/release_config.json" \
            --file build/web/release_config.json \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-cache, max-age=0, must-revalidate" \
            --remote

      # Uploads immutable assets under the commit SHA before promoting the release.
      - name: Upload immutable release assets
        env:
          R2_BUCKET: game-releases
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          find build/web -type f ! -path 'build/web/release_config.json' -print0 | while IFS= read -r -d '' file; do
            key="releases/${RELEASE}/${file#build/web/}"
            case "$file" in
              *.js) content_type="text/javascript; charset=utf-8" ;;
              *.wasm) content_type="application/wasm" ;;
              *.pck) content_type="application/octet-stream" ;;
            esac
            wrangler r2 object put "$R2_BUCKET/$key" \
              --file "$file" \
              --content-type "$content_type" \
              --cache-control "public, max-age=31536000, immutable" \
              --remote
          done

      # Records the prior release so its immutable assets can be removed after promotion.
      - name: Record current release
        env:
          R2_BUCKET: game-releases
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          previous_pointer="$RUNNER_TEMP/previous-current.json"
          if wrangler r2 object get "$R2_BUCKET/current.json" \
            --file "$previous_pointer" \
            --remote; then
            previous_release="$(jq -er '.release | select(type == "string" and test("^[0-9a-f]{40}$"))' "$previous_pointer")"
            printf 'PREVIOUS_RELEASE=%s\n' "$previous_release" >> "$GITHUB_ENV"
          fi

      # Promotes this commit only after every immutable asset has uploaded.
      - name: Publish release pointer
        env:
          R2_BUCKET: game-releases
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          printf '{"release":"%s"}\n' "$RELEASE" > "$RUNNER_TEMP/current.json"
          wrangler r2 object put "$R2_BUCKET/current.json" \
            --file "$RUNNER_TEMP/current.json" \
            --content-type "application/json; charset=utf-8" \
            --cache-control "no-store" \
            --remote

      # Removes the immutable files from the release previously selected by current.json.
      - name: Remove previous release
        if: env.PREVIOUS_RELEASE != '' && env.PREVIOUS_RELEASE != env.RELEASE
        env:
          R2_BUCKET: game-releases
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          previous_config="$RUNNER_TEMP/previous-release-config.json"
          wrangler r2 object get \
            "$R2_BUCKET/releases/$PREVIOUS_RELEASE/release_config.json" \
            --file "$previous_config" \
            --remote
          jq -r '.config.fileSizes | keys[]' "$previous_config" | while IFS= read -r file; do
            wrangler r2 object delete \
              "$R2_BUCKET/releases/$PREVIOUS_RELEASE/$file" \
              --remote
          done
          wrangler r2 object delete \
            "$R2_BUCKET/releases/$PREVIOUS_RELEASE/release_config.json" \
            --remote
