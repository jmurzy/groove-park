name: Checks

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "assets/**"
      - "images/**"
      - "export_presets.cfg"
      - "justfile"
      - "mise.toml"
      - ".markdownlint.json"
      - "**/*.md"
      - "project.godot"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "assets/**"
      - "images/**"
      - "export_presets.cfg"
      - "justfile"
      - "mise.toml"
      - ".markdownlint.json"
      - "**/*.md"
      - "project.godot"
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "tools/**"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Makes repository recipes and source files available to the runner.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Installs the same pinned tools used for local checks.
      - name: Install development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.3

      # Runs the repository's complete validation suite before any release work.
      - name: Run checks
        run: just check
