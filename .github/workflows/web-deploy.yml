name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-deploy.yml"
      - "workers/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just@1.58.0
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: workers/web/package-lock.json

      - name: Install dependencies
        run: just install

      - name: Check Worker
        env:
          EXAMPLE_MESSAGE_2: "hello_world"
          EXAMPLE_SECRET_2: "hello_secret"
        run: just check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Just
        uses: taiki-e/install-action@26e9283f268b880168bdbd2c545dfcd60ec2c6ab # v2.87.13
        with:
          tool: just@1.58.0
          fallback: none

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: workers/web/package-lock.json

      - name: Install dependencies
        run: just install

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EXAMPLE_MESSAGE_2: ${{ secrets.EXAMPLE_MESSAGE_2 }}
          EXAMPLE_SECRET_2: ${{ secrets.EXAMPLE_SECRET_2 }}
        run: just deploy --yes
