name: Deploy Web

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-deploy.yml"
      - "workers/web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.3
          # Resolve Node.js from this worker's .nvmrc when mise installs tools.
          working_directory: workers/web

      - name: Install dependencies
        run: just install

      - name: Check Worker
        env:
          EXAMPLE_MESSAGE_2: "hello_world"
          EXAMPLE_SECRET_2: "hello_secret"
          RESORT_SLUG: "sierra"
        run: just check

  deploy:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/web
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install development tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
        with:
          version: 2026.11.3
          # Resolve Node.js from this worker's .nvmrc when mise installs tools.
          working_directory: workers/web

      - name: Install dependencies
        run: just install

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RESORT_SLUG: ${{ vars.RESORT_SLUG }}
          EXAMPLE_MESSAGE_2: ${{ secrets.EXAMPLE_MESSAGE_2 }}
          EXAMPLE_SECRET_2: ${{ secrets.EXAMPLE_SECRET_2 }}
        run: just deploy --yes
